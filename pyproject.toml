[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelcheck"
version = "0.1.0"
description = "Audit object-detection / segmentation label files (YOLO, COCO) and get an HTML report with thumbnails of every problem."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7"]

[project.scripts]
labelcheck = "labelcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
